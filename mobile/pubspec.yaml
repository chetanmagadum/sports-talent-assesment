name: sports_talent_platform
description: AI-Powered Mobile Platform for Democratizing Sports Talent Assessment
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.10.5+9
  google_mlkit_pose_detection: ^0.12.0
  sqflite: ^2.3.2
  path: ^1.9.0
  path_provider: ^2.1.2
  connectivity_plus: ^5.0.2
  http: ^1.2.0
  shared_preferences: ^2.2.2
  uuid: ^4.3.3
  intl: ^0.19.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/models/
